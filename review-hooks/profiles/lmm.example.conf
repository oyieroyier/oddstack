# Reference adapter for Sokko / Lipa Mdogo Mdogo.
# Copy and maintain this in LMM; do not assume these commands fit another repo.

REVIEW_HOOKS_PROFILE_VERSION=2

PRE_COMMIT_SECRET_SCAN=1
PRE_COMMIT_COMMANDS='node ./ops/ci/check-staged-commit.mjs'

# Warn-only prose check on the message; the checker itself decides strictness
# (WRITING_RULES_STRICT=1), so the trailing || true keeps it advisory.
COMMIT_MSG_COMMANDS='node ./ops/ci/check-writing-rules.mjs --message "$REVIEW_HOOKS_COMMIT_MSG_FILE" || true'

PRE_PUSH_COMMANDS='
base="$(git merge-base HEAD "@{upstream}" 2>/dev/null || git rev-parse origin/main 2>/dev/null || true)"; if [ -n "$base" ]; then node ./ops/ci/check-skeleton-parity.mjs --base "$base"; fi
pnpm audit:pages
'

AI_REVIEW_ENABLED=1
AI_REVIEW_PRODUCT_NAME='Sokko / Lipa Mdogo Mdogo'
AI_REVIEW_DEFAULT_BASE='origin/main'
AI_REVIEW_BACKEND_PATH_REGEX='^(apps/api/|apps/api-nest/|apps/worker/|sql/|packages/types/|apps/web/src/lib/api/)'
AI_REVIEW_SENSITIVE_PATH_REGEX='(^|/)\.env[^/]*$|(^|/)(secrets?|credentials?)\.(json|ya?ml|toml|txt|env)$|\.pem$|\.key$|(^|/)id_(rsa|ed25519|ecdsa)[^/]*$|private-compliance-evidence/'
AI_REVIEW_SENSITIVE_PATH_ALLOW_REGEX='\.example$'

AI_REVIEW_PUSH_MODE=verify
AI_REVIEW_TOTAL_TIMEOUT=600
AI_REVIEW_KILL_GRACE=5
AI_REVIEW_MAX_ATTEMPTS=1
AI_REVIEW_RETRYABLE_FAILURES=''
AI_REVIEW_MIN_RETRY_TIME=30
AI_REVIEW_MAX_DIFF_LINES=3000
AI_REVIEW_MAX_BACKEND_DIFF_LINES=1200
AI_REVIEW_MAX_PROMPT_TOKENS=32000
AI_REVIEW_MAX_PRIOR_REPORT_BYTES=12000
AI_REVIEW_MAX_OUTPUT_BYTES=30000
AI_REVIEW_MAX_BUDGET_USD=2.00

AI_REVIEW_MODEL='claude-sonnet-5'

# LMM keeps non-blocking findings in Plan 160's tracked intake. The target
# repository owns this generator; it receives the reviewed head in
# AI_REVIEW_HEAD_COMMIT and is not bundled here.
AI_REVIEW_MERGE_WITH_FIXES_COMMAND='node plans/evidence/generate-merge-with-fixes-catalog.mjs'

AI_REVIEW_ROLLING_SPEND_LIMIT_USD=10.00
AI_REVIEW_ROLLING_SPEND_WINDOW_HOURS=24
