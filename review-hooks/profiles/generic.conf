# Portable defaults for the collaboration review hooks.
# This file is trusted repository policy and is sourced by Bash.

REVIEW_HOOKS_PROFILE_VERSION=1

PRE_COMMIT_SECRET_SCAN=1
PRE_COMMIT_COMMANDS=''

PRE_PUSH_COMMANDS=''

# AI review is opt-in in the generic profile. Set this to 1 only after choosing
# credential ownership, budgets, path classification, and a repository prompt.
AI_REVIEW_ENABLED=0
AI_REVIEW_PRODUCT_NAME='this repository'
AI_REVIEW_DEFAULT_BASE='origin/main'
AI_REVIEW_BACKEND_PATH_REGEX='^(api/|backend/|server/|src/server/|db/|migrations/|sql/)'
AI_REVIEW_SENSITIVE_PATH_REGEX='(^|/)\.env[^/]*$|(^|/)(secrets?|credentials?)\.(json|ya?ml|toml|txt|env)$|\.pem$|\.key$|(^|/)id_(rsa|ed25519|ecdsa)[^/]*$'
AI_REVIEW_SENSITIVE_PATH_ALLOW_REGEX='\.example$'
AI_REVIEW_TIMEOUT=600
AI_REVIEW_MAX_ATTEMPTS=2
AI_REVIEW_MAX_DIFF_LINES=3000
AI_REVIEW_MAX_BACKEND_DIFF_LINES=1200
AI_REVIEW_MAX_PROMPT_TOKENS=32000
AI_REVIEW_MAX_OUTPUT_BYTES=30000
AI_REVIEW_MAX_BUDGET_USD=2.00
