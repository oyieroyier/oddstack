# Portable defaults for the collaboration review hooks.
# This file is trusted repository policy and is sourced by Bash.

REVIEW_HOOKS_PROFILE_VERSION=2

PRE_COMMIT_SECRET_SCAN=1
PRE_COMMIT_COMMANDS=''

# Commit-message commands read $REVIEW_HOOKS_COMMIT_MSG_FILE. Empty means the
# commit-msg hook does nothing.
COMMIT_MSG_COMMANDS=''

PRE_PUSH_COMMANDS=''

# AI review is opt-in in the generic profile. Set this to 1 only after choosing
# credential ownership, budgets, path classification, and a repository prompt.
AI_REVIEW_ENABLED=0
AI_REVIEW_PRODUCT_NAME='this repository'
AI_REVIEW_DEFAULT_BASE='origin/main'
AI_REVIEW_BACKEND_PATH_REGEX='^(api/|backend/|server/|src/server/|db/|migrations/|sql/)'
AI_REVIEW_SENSITIVE_PATH_REGEX='(^|/)\.env[^/]*$|(^|/)(secrets?|credentials?)\.(json|ya?ml|toml|txt|env)$|\.pem$|\.key$|(^|/)id_(rsa|ed25519|ecdsa)[^/]*$'
AI_REVIEW_SENSITIVE_PATH_ALLOW_REGEX='\.example$'

# Local hooks verify a completed review; they never start a reviewer while
# git push holds a connection. Run the review first with:
#   .review-hooks/bin/review-gate review
AI_REVIEW_PUSH_MODE=verify

# One deadline and one spend cap for the whole run, kill grace included.
AI_REVIEW_TOTAL_TIMEOUT=600
AI_REVIEW_KILL_GRACE=5
AI_REVIEW_MAX_ATTEMPTS=1
AI_REVIEW_RETRYABLE_FAILURES=''
AI_REVIEW_MIN_RETRY_TIME=30
AI_REVIEW_MAX_DIFF_LINES=3000
AI_REVIEW_MAX_BACKEND_DIFF_LINES=1200
AI_REVIEW_MAX_PROMPT_TOKENS=32000
AI_REVIEW_MAX_PRIOR_REPORT_BYTES=12000
AI_REVIEW_MAX_OUTPUT_BYTES=30000
AI_REVIEW_MAX_BUDGET_USD=2.00

# The reviewer model is explicit; a paid run never inherits an interactive
# CLI default.
AI_REVIEW_MODEL='claude-sonnet-5'

# Optional repository-owned command run after a fresh non-blocking
# MERGE-WITH-FIXES review parses and before its decision is cached. It
# receives the reviewed head in AI_REVIEW_HEAD_COMMIT and the parsed result
# as JSON on stdin (see review-hooks/README.md). Empty keeps it off.
AI_REVIEW_MERGE_WITH_FIXES_COMMAND=''

# Rolling cross-run spend cap. Set 0 to disable.
AI_REVIEW_ROLLING_SPEND_LIMIT_USD=10.00
AI_REVIEW_ROLLING_SPEND_WINDOW_HOURS=24
